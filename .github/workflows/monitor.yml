
name: H-1B Visa Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run H-1B monitor
        env:
          VISA_DATA_URL: ${{ secrets.VISA_DATA_URL }}
          VISA_DATA_TOKEN: ${{ secrets.VISA_DATA_TOKEN }}
          VISA_NTFY_TOPIC: ${{ secrets.VISA_NTFY_TOPIC }}
          VISA_NTFY_TOKEN: ${{ secrets.VISA_NTFY_TOKEN }}
          VISA_CUTOFF: "2027-03-31"
          VISA_PUSH_REPEAT: "3"
          VISA_PUSH_INTERVAL: "5"
        run: |
          python monitor.py --once

      - name: Save monitoring state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json history.jsonl
          git diff --cached --quiet || (
            git commit -m "Update H-1B monitoring state" &&
            git push
          )
